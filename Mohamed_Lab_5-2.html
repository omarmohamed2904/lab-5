<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearView Eye Care – Patient Registration</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">👁️ ClearView Eye Care</a>
    </div>
  </nav>

  <header class="hero text-center text-white py-5">
    <div class="container">
      <h1 class="display-5 fw-bold">Clear vision starts here</h1>
      <p class="lead">Eye exams, contact lens fittings &amp; designer frames. Register as a new patient to book your first appointment.</p>
    </div>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="h4 mb-4 text-center">New Patient Registration</h2>

            <form id="registerForm" novalidate>
              <div class="row">
                <div class="col-sm-6 mb-3">
                  <label for="firstName" class="form-label">First Name</label>
                  <input type="text" class="form-control" id="firstName">
                </div>
                <div class="col-sm-6 mb-3">
                  <label for="lastName" class="form-label">Last Name</label>
                  <input type="text" class="form-control" id="lastName">
                </div>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email">
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password">
                <div class="form-text">Must contain a special character: <strong>!</strong> or <strong>?</strong></div>
              </div>

              <div class="mb-4">
                <label for="dob" class="form-label">Date of Birth</label>
                <input type="date" class="form-control" id="dob">
              </div>

              <button type="button" class="btn btn-primary w-100" onclick="register()">Register</button>
            </form>
          </div>
        </div>

        <div id="result" class="mt-4"></div>

      </div>
    </div>
  </main>

  <footer class="bg-dark text-white-50 text-center py-3">
    <small>CSC 225 – Lab 5 · ClearView Eye Care</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
